# Checks pairings.tsv, the merge script and the relay on every push and pull request.
name: check

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check.py pairings.tsv
      - run: python3 tools/test_merge.py
      - run: node relay/test.mjs
