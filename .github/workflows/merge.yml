# Every night: collect the transitions decks shared through the relay, merge them into
# pairings.tsv, check the file, commit, then tell the relay to drop what was merged.
# Needs the repository variable RELAY_URL and the secret RELAY_PULL_TOKEN (relay/README.md);
# without them it does nothing.
name: merge shared transitions

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the pending submissions
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}
          TOKEN: ${{ secrets.RELAY_PULL_TOKEN }}
        run: |
          if [ -z "$RELAY_URL" ] || [ -z "$TOKEN" ]; then
            echo "The relay is not configured (RELAY_URL / RELAY_PULL_TOKEN): nothing to do."
            echo '[]' > pending.json
            exit 0
          fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $TOKEN" "$RELAY_URL/pending" -o pending.json
          python3 -c "import json; print(len(json.load(open('pending.json'))), 'submissions waiting')"

      - name: Merge
        run: python3 tools/merge.py pending.json pairings.tsv acked.json

      - name: Check
        run: python3 tools/check.py pairings.tsv

      - name: Commit
        run: |
          if git diff --quiet -- pairings.tsv; then
            echo "Nothing new."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pairings.tsv
            git commit -q -m "Merge transitions shared from decks"
            git push
          fi

      - name: Tell the relay what was merged
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}
          TOKEN: ${{ secrets.RELAY_PULL_TOKEN }}
        run: |
          if [ -z "$RELAY_URL" ] || [ -z "$TOKEN" ] || [ "$(cat acked.json)" = "[]" ]; then exit 0; fi
          curl -fsS --max-time 60 -X POST -H "Authorization: Bearer $TOKEN" \
            -H "content-type: application/json" --data @acked.json "$RELAY_URL/ack"
